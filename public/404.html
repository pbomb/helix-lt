<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Helix LT Presets</title>
    <script>
      // Redirect GitHub Pages 404s back to index.html, preserving the path.
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 2).join('/') +
        '?p=' + encodeURIComponent(l.pathname.slice(1).split('/').slice(1).join('/')) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
