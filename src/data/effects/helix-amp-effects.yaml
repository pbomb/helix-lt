- name: A30 Fawn Nrm
  based_on: Vox® AC-30 Fawn
  firmware_version: null
  synopsis: The Vox AC-30 Fawn contains two channels. Both the bright channel and
    the normal channel only hit one preamp stage before going to the phase inverter
    in the normal channel only hit one preamp stage before going to the phase inverter
    in the power amp. All of the saturation of this amp comes from the power amp,
    and it can get pretty dirty. The bright channel is pretty bright when run clean,
    but that brightness when driving the power amp results in a wonderfully rich and
    harmonically complex overdrive. It's quite responsive to saturation with picking
    dynamics and volume knob control. Turning up the Bias knob reduces crossover distortion
    the best, but there are no wrong knob settings. If you like the sound coming out,
    the knobs are set right for you.
  notable_users: The Beatles first recordings in the Abbey Road studio used a fawn.
