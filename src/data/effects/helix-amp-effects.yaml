- name: US Super Nrm
  based_on: Fender Super Reverb normal channel
  firmware_version: '3.80'
  synopsis: The Fender Super Reverb guitar amplifier is a renowned model that has
    been a staple for guitarists since its introduction in the mid-1960s. Known for
    its rich, clean tones and powerful reverb, the Super Reverb features a 4x10 speaker
    configuration with Jensen P10R speakers, providing a distinctive, chimey sound.
    The amp offers two channels (normal and vibrato) with controls for volume, treble,
    bass, and additional reverb and tremolo effects on the vibrato channel. The modern
    Tone Master Super Reverb replicates this classic tube amp's sound using advanced
    modeling technology, making it lighter and more versatile for contemporary use,
    including selectable output power and direct line-out for recording or live performance.
  notable_users: Notable users include Stevie Ray Vaughan, Jimmie Vaughan, Johnny
    Marr, Lee Ranaldo, and Freddie King, among others.
