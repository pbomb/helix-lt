- name: Moo)))n Nrm
  based_on: Sunn Model T
  firmware_version: '3.50'
  synopsis: “The Moon model is based on a 1974, silver knob Sunn Model T amplifier.
    This is the early version with the more traditional tone stack. Though it has
    been repaired over the years, the circuit has every component at stock value.
    This specific unit has been well used, well maintained, and regularly enveloped
    in fog. "This amp circuit can best be described as a Fender Tweed Bassman/Marshall
    JTM45 preamp mated with a very high volume, very flat, ultralinear power amp that
    uses 6550 tubes. The result of this configuration is a tone with a raw growl that
    really has a strong punch to the gut. In addition, this configuration takes pedals
    very well; adding a distortion or booster can turn the amp into a high gain, doom
    machine." —Ben Adrian, Sound Design Manager Shred Shed Studios
