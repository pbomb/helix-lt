- name: Essex A30
  based_on: Vox® AC-30 with top boost
  firmware_version: null
  synopsis: 'The Vox AC-30 with Top Boost was the amp made famous by many British
    invasion bands. Much of the unique character of the Vox® sound can be attributed
    to the fact that Class A amps overdrive in a very different way than Class AB.
    Although usually played fairly clean, a cranked AC 30 has a great saturated lead
    tone. Tips: Starting Point: Master 10, set Drive to taste, Mid 5 (50%), Instead
    of turning up Drive, try boosting the input signal before the amp. Cabinet suggestion:
    Alinco Silver Or use (or combine with) Marshall greenbacks (4x12 20w or 25w).
    Alternative: Red Wirez Vox and Marshall greenbacks, Ownhammer Blue and greenbacks.
    greenbacks.'
  notable_users: The Beatles, The Shadows, Tom Petty & The Heartbreakers, Brian May
