- name: Voltage Queen
  based_on: Victoria® Electro King
  firmware_version: null
  synopsis: The Electro King is an idealized recreation of the classic McCarty era
    GA-40. Its circa 1957 circuit features two cathode biased 6V6s for 15watts of
    recording and small club power. The heart and soul of the Electro King is its
    5879 preamp circuit; a single NOS 5879 input pentode for each of the normal and
    tremolo channels provides rich distortion and natural tube compression at any
    volume setting. Notes seem to be 'blown' out of the amp with overdriven tones
    that are saturated, dynamic and musical.
