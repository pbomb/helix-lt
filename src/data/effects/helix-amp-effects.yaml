- name: US Double Nrm
  based_on: Fender® Twin Reverb®
  firmware_version: null
  synopsis: An all-time classic of biting twang and shimmering clean tones, the Fender
    Twin Reverb first hit the scene in 1964 and quickly became the standard for large,
    fully featured touring combos. The Normal channel is the mellower of the two,
    with less gain than the Vibrato channel. The Vibrato channel is a separate preamp
    circuit with clipping characteristics that are different than the Normal channel
    due to an additional 12Ax7 tube stage.
  notable_users: Played clean but singing with a Telecaster, this is the sound of
