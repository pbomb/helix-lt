- name: Grammatico GSG
  based_on: Grammatico GSG100
  firmware_version: '3.60'
  synopsis:
    text: 'The GSG100 is an authentic recreation of a Dumble Overdrive Special using
      the same vintage components acquired over decades as used in the late 70''s
      - early 80''s era Dumble amps. Painstaking and meticulously studied to learn
      and capture the tone as verified in side by side tests. — Per Ben Adrian, Sound
      Design Manager: The Grammatico GSG100 is an amp based on the study of Dumble
      amps made around 1980. This model aims to capture all the unique details of
      this amplifier circuit, many of which are quite different than popular guitar
      amps from the major companies. The GSG100 is a feature-rich and complicated
      amp. There are many amazing sounds in the amp; however, the controls allow for
      such a wide range of adjustment that it''s possible to get unpleasant sounds
      from it as well. To best use the amp, it really helps to know exactly what each
      of these features is doing to the guitar signal. Let''s go through the parameters
      as they are found in the Helix model: model to fit the pattern of all the Helix
      models. On the real amp is says "Volume." by amp nerds), located between the
      first and second gain stages in the preamp. These have different ranges than
      traditional guitar amp tone controls. Also, the whole voicing of the tone stack
      can be changed with the "Rock/Jazz" switch, which will be explained later. the
      amount of high frequency in the power amp by modifying the EQ filtering in the
      power amp''s negative feedback loop. tone or distortion of the amp model between
      the preamp and power amp and can be used to get more or less power amp distortion.
      This amp is VERY loud, and most players would probably run the master volume
      on the lower side. If the master volume is cranked, the power amp distortion
      can be pushed into unpleasant territory. Most players would never crank the
      master in real life as the actual output would be way too loud for most musical
      settings. stack. When it is off, the amp has more of a scooped sound. When it
      is on, there is a noticeable upper-mid boost. for two totally separate tonal
      voices. Jazz is quieter with a lower center frequency for the mids. Rock is
      louder with a more traditional mid frequency center. Tone controls rarely translate
      well between the Jazz and Rock settings. If a good sound is achieved in one
      mode, it is not guaranteed that the same settings in the opposite mode will
      still sound pleasing. This circuit is located AFTER the tone controls and Drive
      knob. When the overdrive is turned on it''s as if a third and fourth gain stage
      is added to the preamp. Generally, it''s best to set up the base tone of the
      amp with the Drive and tone controls first, and then adjust the overdrive circuit
      to work with the desired base tone. circuit. Since the whole overdrive circuit
      is after the amp''s regular drive and tone controls, the range of OD Drive knob
      will change based on those earlier knob settings. Bright—This is a three position
      switch. The settings are "off" and two different values of bright capacitor.
      This bright capacitor works with the Drive (volume) knob earlier in the circuit,
      and is similar to other amps that have bright switches. When the Bright switch
      is engaged, the effect is more pronounced with lower Drive settings. The bright
      becomes less effective at higher Drive settings. When the Drive is at 10, the
      switch is effectively removed from the amp circuit, and changing the switch
      settings has no audible effect. circuit at the very beginning of the amp circuit.
      It is akin to placing a FET Boost pedal before the amp. On the physical unit
      there are two input jacks, but on the model it is placed on a switch and can
      even be made foot-switchable. The FET Boost has a fixed boost amount of about
      7 to 9 dB and also gives a slight EQ change. controls from the circuit. Tone
      controls work by removing frequencies and signal level. Engaging the PAB circuit
      returns all of this lost signal level, but the side effect is that tone controls
      no longer work. It truth, the treble knob does work slightly, and the mid switch
      will change how much lows and mids comes through the circuit. In general, though,
      the PAB trades tone control functionality for a full blast level between tube
      gain stages 1 and 2. some amount of power supply sag, which feels like compression,
      squish, and sustain to the player. This control makes the sag amount user-adjustable.
      heaters in tube amps will leak a little bit of 60 cycle hum into the audio signal.
      When this hum mixes with the distorted audio signal, a non-musical distortion
      is created at low levels. To some players, this low-level, non-harmonic distortion
      adds a bit of realism to the amp model. The best way to put it is that sometimes
      the model sounds more "wrong" without the hum. However, if you don''t like it,
      you can just turn it down. circuits will sometimes let a little bit of rectified
      120Hz hum (that the power supply filter caps can''t quite fully remove) into
      the audio signal. When the power supply is being pushed hard, more of this ripple
      can get through the audio path. Much like the hum, this provides a bit of non-musical
      distortion to the power amp at distorted settings. To some people, this sounds
      like harmonic complexity that is enjoyable and realistic. Other players just
      don''t like it and turn it off. the power amp, causing a change in tonality
      and the distortion characteristic. hang on. All tube amps need to bias the power
      amp tubes. This is usually achieved by applying a negative voltage to the input
      audio signal. (Cathode bias works differently, but that''s a story for a different
      time.) However, when the power tubes are distorting, free electrons can form
      around the input grid and cause a shift in the bias voltage. This shift only
      happens during the moments when distortion is occurring. This shift causes a
      tonal and texture change much like adjusting the bias control. However, once
      the tubes leave the distorted state, the free electrons dissipate and the bias
      returns to normal. Another way to put it (less accurately) is that this is a
      level/envelope controlled bias shift. This behavior is modeled in all Helix
      amps, and the Bias X control allows users to control the amount of bias shift
      that is happening. It is a very subtle change, so please don''t expect high
      drama from this knob.'
