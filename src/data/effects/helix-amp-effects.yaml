- name: Essex A15
  based_on: Vox® AC-15
  firmware_version: null
  synopsis: For the AC-15, the master volume is post-phase-inverter in the full amp
    model. This allow the user to use the Drive knob to hit just the Phase Inverter
    tubes harder. However, in this amp the power tubes can distort a LOT. When this
    is combined with the fact that the preamp doesn't distort a whole lot on its own,
    it can produce a situation where turning the preamp up and the master volume down
    will clean up the sound quite a bit. The preamp barely distorts and the power
    amp distorts a TON. This is the opposite of many amps where the preamp is designed
    to distort and, while the power amp can distort as well, most of the crunch comes
    from smashing the preamp.
