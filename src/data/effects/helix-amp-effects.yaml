- name: US Deluxe Nrm
  based_on: Fender® Deluxe Reverb®
  firmware_version: null
  synopsis: 'The Normal channel is the mellower of the two, with less brightness and
    gain than the Vibrato channel. The Vibrato channel is a separate preamp circuit
    with tone and clipping characteristics that are different than the Normal channel
    due to an additional 12Ax7 tube stage. High frequencies are increased due to the
    addition of a bright cap across the volume knob. Most players love a Deluxe Reverb®
    when it''s turned up to about 7 for a nice gritty sound that cleans up when you
    back off your guitar''s volume knob just a little. Notice how the tone control
    response changes as this Amp Model''s Drive is changed: clean settings are crisp
    and present, while more driven settings will mellow the high end. This is typical
    of what you get from a Deluxe Reverb® and is nicely captured here.'
  notable_users: Muddy Waters, Mike Campbell, Jackson Brown, Vince Gill, Elvis Costello,
    Pete Townshend, Buddy Guy. Honestly, this list could go on and on.
