- name: US Princess
  based_on: Fender® Princeton Reverb
  firmware_version: '3.00'
  synopsis: A historically significant amp used on countless hit songs for decades.
    Today, the Princeton Reverb is as phenomenal looking, sounding and performing
    as ever, and is easily versatile enough to go from the living room to the recording
    studio to the gig with the great sound, style, reliability and authentic vintage
