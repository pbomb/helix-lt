- name: Tesselator
  based_on: Line 6 Original
  firmware_version: '3.15'
  synopsis:
    text: 'Tesselator is part morphing delay, part loop sampler, part drone machine...
      it''s stellar for creating rhythmic pads, textures, or pitch/filter ramp effects
      to play over and has been placed in the Delay category so you can run multiple
      instances at once. Once audio is captured and repeating, you can effectively
      transition/morph between two states—First and Last, each with its own time,
      speed/pitch, HP filter, and LP filter—by applying increasing amounts to each
      repeat until the target settings are reached. 1. Assign Tesselator to a stomp
      footswitch. It''s bypassed by default. 2. Play a chord and while it''s ringing,
      press the Tesselator switch. Audio captured BEFORE the switch press is repeated
      and manipulated by the following parameters: length of repeated audio when first
      engaged. Press the knob to toggle between ms and note values the First step''s
      time, the sequence will get shorter; if longer than the First step''s time,
      the sequence will get longer. If First and Last are the same time, the sequence
      length remains constant (Ex. 1 below). Press the knob to toggle between ms and
      note values example, if your first step is 100ms and your last step is 500ms,
      each successive step in the sequence will lengthen from 100ms to 500ms. The
      more steps you have, the longer it takes to reach the last step and therefore,
      the longer it takes to alter the sequence''s characteristics on, all steps play
      forward, then backward, then forward again, etc. (Ex. 3a below) on (remember,
      it''s bypassed by default) With Tesselator on a parallel path, assign a second
      stomp switch to toggle between Mute All and Dry Kill. This lets you leave the
      block enabled and bring the effected signal in and out by switching between
      the two values signals are heard reference a static or semitone value parameter
      to set the specific value (0.0x speed ~ 2.0x speed) set the value (-12 ~ +12
      semitones; see Ex. 3c below) the last step will be twice as fast as the first
      step and if set to "0.0x," the last step will appear to stop completely. Disabled
      unless Type is set to "Speed" last step will be an octave lower than the first
      step. Disabled unless Type is set to "Pitch" (see Ex. 3c below) Sets the high-pass
      (low cut) filter target for the last step. For example, if set to a higher value,
      each successive step will filter out more bass until the last step of the sequence
      Sets the low-pass (high cut) filter target for the last step. For example, if
      set to a higher value, each successive step will filter out more treble until
      the last step of the sequence (Ex. 3b below) Woohoo! More charts and diagrams!
      Tesselator is capable of hundreds of unique sounds, and it''s impossible to
      illustrate them all, but here are a few examples: Example 1: If Knob 1 (First)
      and Knob 2 (Last) are set to the same value (say, 1/4 note), the same length
      of audio repeats until Tesselator is bypassed. In this case, it acts very much
      like Delay > Ratchet, except the audio is captured BEFORE the stomp press, not
      after. Example 2: If Knob 2 (Last) is set to a shorter time than Knob 1 (First),
      steps in the sequence progressively get shorter (Ex. 2a). If Last is set to
      a longer time than First, steps in the sequence progressively get longer. The
      last step is repeated indefinitely until Tesselator is bypassed. Setting Direction
      to "Reverse" (Ex. 2b) reverses all steps; setting Direction to "Fwd/Rev" (Ex.
      2c) alternates between forward and reversed steps. Example 3: Turning Boomerang
      to "On" plays the entire step sequence forward, then backward, then forward
      again, etc. (Ex. 3a) Increasing LP Filter to a higher value progressively darkens
      each step in the sequence (Ex. 3b). Increasing HP Filter to a higher value progressively
      thins out each step in the sequence. Setting Type to "Pitch" and Pitch to a
      value other than "0" will change the pitch of each step until it lands on the
      target pitch at the last step. For example, if Pitch is set to "+5" and you
      play an E note, the last note in the sequence will be an A, or 5 steps higher
      (Ex. 3c). If you want the last A note to repeat indefinitely instead of stepping
      back down to E, turn Boomerang back to "Off." TIP: You can change all of these
      parameters while Tesselator is... tessellating, to create evolving, engaging
      soundscapes. Run it into Pitch > Dual Pitch and Reverb > Shimmer and prepare
      to waste hours in drone land.'
