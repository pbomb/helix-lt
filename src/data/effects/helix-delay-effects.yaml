- name: Ratchet
  based_on: Line 6 Original
  firmware_version: '3.15'
  synopsis:
    text: A buffer sampler/delay. Used to capture and loop a short snippet of audio
      (whose length is determined by the Time parameter) while the block is enabled.
      Great for rhythmic stutter effects. You could almost consider Ratchet a simplified
      version of Tesselator, where the audio is captured AFTER the footswitch press,
      not before. 1. Assign Ratchet to a stomp footswitch. It's bypassed by default.
      2. While playing, press the Ratchet switch. Audio captured AFTER the switch
      press is repeated for as long as the block is enabled. For this reason, it may
      be best to make the switch momentary, and only step on the Ratchet switch when
      you change chords, almost like a really messed up (and by messed up, we mean
      awesome) sustain pedal. loop an entire 4/4 bar, choose "1/1"; to stutter your
      playing, start with "1/16" or "1/32" (remember, it's bypassed by default) Ratchet
      on a parallel path, assign a second stomp switch to toggle between Mute All
      and Dry Kill. This lets you leave the block enabled and bring the effected signal
      in and out by switching between the two values are heard
    items:
    - Time—Predetermines the length of the audio to be recorded and looped. To
    - Operation—Determines what happens to your signal when Ratchet is turned on
    - '"Mute All"—When Ratchet is on, THE ENTIRE PATH IS MUTED'
    - '"Dry Kill"—When Ratchet is on, only the effected signal is heard. TIP: With'
    - '"Normal" (default)—When Ratchet is on, both the dry and effected signals'
    - FX Level—Controls the level of the looped audio
    - Level—Controls the overall output level of the block
  available_parameters:
  - TempoSync1
  - Note Sync
  - Time
  - FX Level
  - Level
  - Operation
