- name: Elephant Man
  based_on: Electro-Harmonix® Deluxe Memory Man
  firmware_version: null
  synopsis: 'Mix: Allows you to vary the mix of direct and delayed signals; it is
    set to the center position equal levels of both. Feedback: Provides delay repeats,
    or multiple echoes. If set very high, runaway oscillation will occur. Fairly high
    feedback with short delay settings produces a reverb effect. Time: Determines
    the time between direct and delayed signals, and between the repeats when feedback
    is used. Strange, eerie and unusual pitch-shift effects can be produced by changing
    the delay while playing, especially while using feedback. Mode: Allows you to
    choose between Chorus or Vibrato mode. The Vibrato mode produces a "Doppler" pitch
    shifting effect in the delayed signal. A rich, vibrant chorus effect is produced
    with the switch set to CHORUS, delay fairly short, blend at the center, chorus
    set high, and feedback fairly high. Depth: The DEPTH control sets the amount of
    modulation in the delay time. The modulation rate is slow for chorus and faster
    for vibrato.'
  notable_users: 'The Foo Fighters make extensive use of the Memory Man alongside
    a Pro Co Rat into a Vox AC-30 on their third album, There''s Nothing Left to Lose.
    See the following excerpts: What was the fundamental guitar-sound recipe for the
    new album? We focused on not using too many distortion pedals, and went for a
    cleaner, fatter, more natural overdrive. We used a Vox AC30 for pretty much everything
    on the record, tweaking the sound so that it broke up nicely when played loud.
    Sometimes we''d double a track using an old Pro Co Rat, and then hard-pan the
    parts so that a super-distorted guitar was in the left channel and a grindy guitar
    was in the right. Then we''d sprinkle in lots of clean guitar overdubs. How did
    you get the undulating tone on "Breakout"? That''s the Memory Man through the
    Vox. We tried to set the wave of the phase so that it was in sync with the rhythm
    of the song. Note: It is believed Mr. Grohl mispoke here and actually meant the
    MXR Phase 90 (Script Mod Phase) with its speed knob set around 11 o''clock. "Headwires"
    is filled up with so many guitar parts, yet the mix doesn''t sound "Headwires"
    is filled up with so many guitar parts, yet the mix doesn''t sound cluttered.
    Oh yeah -- Adam''s good with that stuff. The main riff is an Explorer playing
    through the Memory Man and the Vox, and the harmonics were done with the same
    setup. The choruses are the Duo Jet running through a Rat and the Vox. The high,
    picking part in the middle eight is an SG through the Memory Man. Check out the
    rest of this fantastic interview with Dave Grohl from a 1999 issue of Guitar Player
    Magazine for more details.'
