- name: Teemah!
  based_on: Paul Cochrane Timmy® Overdrive
  firmware_version: null
  synopsis:
    text: The Timmy Overdrive provides a versatile range of overdrive tones that enhance
      the natural sound of your guitar and amp setup. With three different clipping
      options and ingeniously configured Bass and Treble controls, this pedal offers
      players a ton of options to make the most of their playing and recording experience.
    items:
    - Gain adjusts overdrive intensity
    - Bass Cut cuts the low end frequencies from pre-overdrive signal
    - Treble Cut cuts high end frequencies from post-overdrive signal
    - Clipping switch sets the clipping mode
    - Level adjusts overall volume of effect
  clipping_modes:
    text: a wide, dynamic range of sounds. definition for a big sound.
    items:
    - 'Up: Asymmetrical clipping with moderate saturation and slight compression for'
    - 'Center: Symmetrical clipping with light saturation, high headroom, and high'
    - 'Down: Symmetrical clipping with heavy saturation and low headroom.'
  available_parameters:
  - Gain
  - Bass Cut
  - Treble Cut
  - Clipping
  - Level
