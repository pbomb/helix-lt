- name: Ratatouille Dist
  based_on: 1984 Pro Co RAT
  firmware_version: '3.10'
  synopsis:
    text: Turns out our Vermin Dist model was broken. Sorry! We were going to replace
      it completely but a bunch of people had presets with the old version. On top
      of that, we found out our RAT's LM308 chip had crapped out since we modeled
      it last so we decided to get it into perfect working order and start from scratch
      basically letting more treble through (lower values) or filtering it out (higher
      values)
    items:
    - 'Gain: Sets the amount of distortion'
    - 'Filter: Sets the amount of high cut (low pass) filter applied to the distortion;'
    - 'Level: Sets the overall level of the block'
  blues_type_tone:
    text: This setting produces a "bluesy" soft-clipped distortion sound much like
      that of a small tube amp. "Fine tune" the control settings to suit your instrument's
      own tone and character.
    items:
    - 'Gain: 3.5-4'
    - 'Filter: 0'
    - 'Level: 6.5-7'
  lead_type_tone:
    text: A very "biting" lead sound with lots of harmonic emphasis; use the treble
      pickup on your guitar and vary the DISTORTION control a bit to "home in" on
      the overtones for a subtle fixed-"wah" effect.
    items:
    - 'Gain: 6.5-7'
    - 'Filter: 8-8.5'
    - 'Level: 5-5.5'
  heavy_type_tone:
    text: A bone-crunching heavy-metal sound yielding incredible power and smooth,
      effortless sustain.
    items:
    - 'Gain: 10'
    - 'Filter: 5-5.5'
    - 'Level: 3.5-4'
  notable_users:
    text: 'The Foo Fighters make extensive use of the Pro Co Rat alongside a Memory
      Man into a Vox AC-30 on their third album, There''s Nothing Left to Lose. See
      the following excerpts: What was the fundamental guitar-sound recipe for the
      new album? We focused on not using too many distortion pedals, and went for
      a cleaner, fatter, more natural overdrive. We used a Vox AC30 for pretty much
      everything on the record, tweaking the sound so that it broke up nicely when
      played loud. Sometimes we''d double a track using an old Pro Co Rat, and then
      hard-pan the parts so that a super-distorted guitar was in the left channel
      and a grindy guitar was in the right. Then we''d sprinkle in lots of clean guitar
      overdubs. Check out the rest of this fantastic interview with Dave Grohl from
      a 1999 issue of Guitar Player Magazine for more details.'
    items:
    - Kurt Cobain
    - Krist Novoselic
    - Jeff Beck
    - Jerry Cantrell
    - Dave Grohl
    - David Gilmour
    - Thom Yorke
    - Rivers Cuomo
    - James Hetfield
    - Many, many more…
  available_parameters:
  - Gain
  - Filter
  - Level
