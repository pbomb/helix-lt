- name: Noise Gate
  based_on: Line 6 Original
  firmware_version: null
  synopsis: Use this to eliminate the hiss from noisy pickups or the white noise from
    extremely high gain distortions by placing the noise gate further in your signal
    path chain.
  available_parameters:
  - Threshold
  - Decay
  - Level
- name: Hard Gate
  based_on: Line 6 Original
  firmware_version: null
  synopsis: With more controls than the Noise Gate, you can further use this one for
    intentional effects, such as stuttering and lopped- off power chords.
  available_parameters:
  - Open Threshold
  - Close Threshold
  - Hold Time
  - Decay
  - Level
- name: Horizon Gate
  based_on: Horizon Devices Precision Drive's gate circuit
  firmware_version: '3.00'
  synopsis: Includes an extra Gate Range parameter that, when set to "Extended," drops
    the gate's threshold down to -90dB. Works best before an amp.
  available_parameters:
  - Mode
  - Sensitivity
  - Gate Range
  - Level
