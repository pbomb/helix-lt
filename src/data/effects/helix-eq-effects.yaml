  - Level
- name: Acoustic Sim
  based_on: BOSS® AC-2 Acoustic Simulator
  firmware_version: '3.00'
  synopsis: Includes an extra Shimmer parameter that imparts some motion to the harmonics,
    reminiscent of how a string's vibration tends to affect the other strings. Just
    like the original, works best with single-coil pickups. Can be used alone or in
    conjunction with an acoustic IR.
  available_parameters:
  - Mode
  - Body
  - Top
  - Shimmer
  - Level
