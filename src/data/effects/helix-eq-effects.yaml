- name: Parametric EQ
  based_on: Line 6 Original
  firmware_version: null
  synopsis: 'Three bands only: Low shelf, single parametric Mid, High shelf — plus
    Low Cut and High Cut filters. There are NO separate Low-Mid and High-Mid bands.
    Telephone filter EQ pattern for The Strokes signature tone: Low Cut 100–120 Hz,
    Low Gain -2 to -4 dB, Mid Freq 600–800 Hz, Mid Gain +3 to +5 dB, High Cut 8000–9500 Hz.'
  available_parameters:
  - Low Freq
  - Low Q
  - Low Gain
  - Mid Freq
  - Mid Q
  - Mid Gain
  - High Freq
  - High Q
  - High Gain
  - Low Cut
  - High Cut
  - Level
- name: Tilt
  based_on: Line 6 Original
  firmware_version: '2.80'
  synopsis: Tilt is a subtle 6dB EQ that boosts high frequencies while simultaneously
    attenuating low frequencies (or vice versa). Great for quickly making tones a
    bit brighter or darker. The Center Freq parameter sets the frequency around which
    the boost and cut pivot.
  available_parameters:
  - Tilt
  - Center Freq
  - Level
