      audio signal, a non-musical distortion is created at low levels. To some players,
      this low-level, non-harmonic distortion adds a bit of realism to the amp model.
      The best way to put it is that sometimes the model sounds more "wrong" without
      the hum. However, if you don''t like it, you can just turn it down. circuits
      will sometimes let a little bit of rectified 120Hz hum (that the power supply
      filter caps can''t quite fully remove) into the audio signal. When the power
      supply is being pushed hard, more of this ripple can get through the audio path.
      Much like the hum, this provides a bit of non-musical distortion to the power
      amp at distorted settings. To some people, this sounds like harmonic complexity
      that is enjoyable and realistic. Other players just don''t like it and turn
      it off. the power amp, causing a change in tonality and the distortion characteristic.
      hang on. All tube amps need to bias the power amp tubes. This is usually achieved
      by applying a negative voltage to the input audio signal. (Cathode bias works
      differently, but that''s a story for a different time.) However, when the power
      tubes are distorting, free electrons can form around the input grid and cause
      a shift in the bias voltage. This shift only happens during the moments when
      distortion is occurring. This shift causes a tonal and texture change much like
      adjusting the bias control. However, once the tubes leave the distorted state,
      the free electrons dissipate and the bias returns to normal. Another way to
      put it (less accurately) is that this is a level/envelope controlled bias shift.
      This behavior is modeled in all Helix amps, and the Bias X control allows users
      to control the amount of bias shift that is happening. It is a very subtle change,
      so please don''t expect high drama from this knob.'
