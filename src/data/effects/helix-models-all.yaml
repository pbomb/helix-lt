- name: Line 6 Badonk
  based_on: Line 6 Original inspired by the original high gain Big Bottom model
  firmware_version: null
  synopsis: 'To create the Line 6 Badonk, the Big Bottom model from the XT code was
    rebuilt using new tools so that the overall EQ and pre-post distortion filtering
    matched. The previous tone stack was a little limited, so it was tuned up to have
    more range and provide a realistic, interactive response. To make this model feel
    more like a full amp, the power amp from the Fatality model (mesa rectifier mod)
    was added then tweaked slightly to reinforce the overall EQ curve of the Big Bottom.
    Tone Secret: The Big Bottom does not have a crap-load of low frequency. Instead,
    it is an amp with a slightly more than average amount of low end that can really
    hold together while being fed a lot of low frequency. It holds together well with
    heavily detuned guitars.'
