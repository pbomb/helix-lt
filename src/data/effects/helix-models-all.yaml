  synopsis: The Bogner Ecstasy 101B guitar amplifier is a versatile, high-performance
    amp head known for its exceptional tonal range and flexibility. This 100-watt
    tube amp features three channels, each with three gain levels, allowing guitarists
    to switch between clean, overdrive, and high-gain tones effortlessly. It includes
    EL34 power tubes and 12AX7 preamp tubes, providing a rich, dynamic sound. The
    Ecstasy 101B offers a Class A/AB switch, a half-power switch, and a Plexi mode,
    enabling users to achieve both vintage and modern tones. Additional features include
    dual presence controls, a tube-driven effects loop, and a comprehensive footswitch
