- name: Tweed Blues Nrm
  based_on: Fender® Bassman
  firmware_version: null
  synopsis: An amp with the fat bottom end you'd expect from a bass amp, but also
    has the Fender® twang on the top. Try a Drive setting of about 4 or 5 — it's guaranteed
    to dredge up the best R & B licks you know. Sounds great with a Booster Drive
    (Treble) in front. The normal channel is the mellower of the two, with less brightness
    and gain than the Bright channel. The bright channel utilizes the second half
    of the first preamp tube for a different voicing. High frequencies are increased
    due to the addition of a bright cap across the volume knob.
  notable_users: The Bassman doesn't have a master volume, so like all amps of this
    era, you had to crank this mutha up to get that dirty tone revered by all Bassman
    enthusiasts! As Buddy Guy, Bruce Springsteen, Jimmy Vaughan, and so many others
    would tell you, when you're talking vintage amps, the Bassman really is ground-zero
    for big- combo tone.
  available_parameters:
  - Drive
  - Bass
  - Mid
  - Treble
  - Master
  - Ch Vol
  - Sag
  - Hum
