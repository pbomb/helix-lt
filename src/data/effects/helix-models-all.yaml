  firmware_version: null
  synopsis: Although they were usually based loosely on circuits used in classic Marshall
    amps, Park models were often given clever new twists, such as the increased front-end
    gain in the 75 and the use of military-grade KT88 output tubes rather than the
    traditional EL34s. Add it all up, and it's a sizzling, crunchy plexi-style tone
    like nothing you've ever heard before, equally adept at classic British blues-rock
    and contemporary grind. The Normal channel is the mellower of the two, with less
    brightness and gain than the Bright channel. The Bright channel utilizes the second
    half of the first preamp tube for a different voicing. High frequencies are increased
    due to an inter-stage high-shelving filter.
