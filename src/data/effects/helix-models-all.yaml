- name: Line 6 Ventoux
  based_on: Line 6 Original
  firmware_version: '3.15'
  synopsis:
    text: '"The amp model name is Ventoux, which is a mountain in the south of France
      that is a legendary cycling climb. I did it in 2018 and it was awesome and very
      hard. This model comes from a physical amp idea I had a while back. I was going
      to build it as a tube amp first. There are only so many hours in a day, though.
      The idea was to create a “coveted boutique amp” that had a different origin
      story. Most coveted boutique amps come from modified black panel Fenders or
      modified Marshall circuits. I wanted to do the same thing, but base it on the
      early 70s Orange circuits and the mid-wattage Fender Tweed circuits. Ventoux
      has a unique topology. In an indirect way, every knob is kind of a gain/drive
      control. The tone controls adjust the character and/or amount of the overdrive
      in those frequencies. This might be seen as complicated by some, but I find
      it exciting and full of possibilities." —Ben Adrian, Sound Design Manager values
      result in looser distortions and warmer cleans sounds of traditional 60s Fender
      amps; at higher values it''s flatter, like the 50s tweed amps that have very
      little tone-shaping in the circuits. Plus, a full-up mid sound will get a nice
      crunch when Drive is up treble controls. That is accounted for with Depth and
      Presence controls; bass and treble for the power amp. These actually occur in
      the circuit just before phase inverter, but they really need the whole power
      amp to function. They also affect the character of the power amp distortion
      amp. Generally, you''ll want to leave this at 10.0, like a vintage amp with
      no master volume. However, a variety of textures can be had by reducing the
      level'
    items:
    - Drive—Controls the amount of amp drive
    - HP Filter—Higher values result in tighter distortions and thinner cleans; lower
    - Mid—Allows for more character than most. At lower values it's like the scooped
    - Presence/Depth—You may have noticed this amp was lacking regular bass and
    - Ch Vol—Sets the overall level of the Amp block
    - Master—Ventoux's Master volume exists in an "impossible" place for a physical
