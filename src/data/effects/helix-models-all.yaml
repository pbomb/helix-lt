- name: EV Panama Blue
  based_on: EVH 5150III 100 [6L6] Blue channel
  firmware_version: '3.80'
  synopsis: The EVH 5150III 100 [6L6] guitar amplifier is a powerful 100-watt tube
    amp designed for versatility and high-performance sound. Featuring three channels—
    clean, crunch, and lead—it offers a wide range of tones suitable for various musical
    styles. The amp is equipped with dual-concentric controls for independent gain
    and volume adjustments on the first two channels, while the lead channel has its
    own dedicated controls. With EL34 power tubes, the 5150III delivers a dynamic
    sound characterized by articulate highs and robust lows. Additional features include
    a global presence and resonance control, an effects loop, and MIDI compatibility,
    making it a favorite among professional guitarists seeking a reliable and expressive
    amplifier.
  notable_users: The EVH 5150III 100 [6L6] guitar amplifier is endorsed by several
    prominent musicians, including Eddie Van Halen, who co-designed the amp and is
    known for its versatile tone. Alex Lifeson utilizes it for a wide range of sounds,
    while Kirk Hammett appreciates its aggressive, dynamic capabilities. Steve Vai
    values the amp's versatility across various styles, and Derek Trucks uses it for
    its rich tonal palette. These artists rely on the 5150III to achieve their signature
    sounds in a variety of genres.
