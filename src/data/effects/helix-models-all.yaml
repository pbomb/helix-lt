  firmware_version: null
  synopsis: This model is used for the guitar tracks in this video. For complete details,
    read the videos description on YouTube. Around 1984, Ken Fischer designed the
    Trainwreck Express. This design was born out of a collaboration with a client
    who was constantly seeking modifications for his 1959 Marshall Super Lead to emulate
    Eddie Van Halen's tone. He tweaked the Plexi's preamp circuit to drastically increase
    the gain and harmonics, but the amp was then far too loud for of practical use.
    To make the amp quieter, Fischer reduced the output by switching out the four
    EL34 tubes for 6V6s. The client preferred the EL34 tone, however, so Fischer decided
    to reduce the output stage to two EL34s.
