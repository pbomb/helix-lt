- name: Retro Reel
  based_on: Line 6 Original
  firmware_version: '3.10'
  synopsis:
    text: 'Line 6 Original effect that simulates playing a signal back from an analog
      tape machine. This signal can be distorted, filtered to sound older or more
      lo-fi, and modulated with a Wow/Flutter control distortion. At lower settings,
      it''s great for simply warming up a tone settings, can provide a lo-fi effect
      settings, can provide the natural high-end roll-off of old tape Fluttr control
      and the filtering response of the analog tape emulation Tip: Helix Native users
      should definitely try Retro Reel on all sorts of tracks—vocals, Tip: Helix Native
      users should definitely try Retro Reel on all sorts of tracks—vocals, drums,
      keyboards, strings, busses, effects returns, you name it. Anything that needs
      a bit more punch or vibe.'
    items:
    - 'Wow Fluttr: Determines how much warbly tape sound is heard'
    - 'Saturation: Adds an analog tape saturation and at high enough settings,'
    - 'Low Cut: Determines the frequency of the Low Cut (High Pass) filter. At higher'
    - 'High Cut: Determines the frequency of the High Cut (Low Pass) filter. At lower'
    - 'Tape Speed: Changes both the rate of the modulation applied by the Wow'
    - 'Level: Sets the overall level of the block'
  available_parameters:
  - Wow Fluttr
  - Saturation
  - Low Cut
  - High Cut
  - Tape Speed
  - Level
  - Texture
