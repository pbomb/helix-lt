- name: Boctaver
  based_on: BOSS® OC-2 Octaver
  firmware_version: '3.50'
  synopsis: The OC-2 Octave pedal lets users fatten up their sound by adding two additional
    tones--one and two octaves below the original note. Each tone has a separate volume
    control and plays back with outstanding clarity.
  available_parameters:
  - -1 Oct
  - -2 Oct
  - Dry Level
- name: Poly Pitch
  based_on: Line 6 Original
  firmware_version: '3.00'
  notes: 'Confirmed valid parameters (others previously listed, e.g. TempoSync1/TempoSync2/Note
    Sync, do not exist on this block). ShiftCurve/ReturnCurv accept: StartSlow5, StartSlow4,
    StartSlow3, StartSlow2, StartSlow1, Linear, StartFast1, StartFast2, StartFast3, StartFast4,
    StartFast5. Tracking accepts: X Fast, Fast, Stable, X Stable. Shift Time/ReturnTime form a
    per-note pitch envelope: on each new note the shift ramps from unshifted up to the full
    Interval/Cents amount over Shift Time, then ramps back down over ReturnTime on release/decay.
    For a constant always-on harmony (e.g. emulating a POG-style octave doubler) set both times
    very low (~1ms) with a Linear curve so the shift is effectively instantaneous rather than an
    audible glide; longer times are useful for pitch-bend/swell style effects instead.'
  available_parameters:
  - Interval
  - Cents
  - Shift Time (ms)
  - ShiftCurve
  - ReturnTime (ms)
  - ReturnCurv
  - Tracking
  - Auto EQ (0.0-10.0)
  - Mix (%)
  - Level (dB, -60.0 to 6.0)
- name: Poly Wham
  based_on: Line 6 Original
  firmware_version: '3.00'
  synopsis: Automatically assigned to EXP 1 and the toe switch toggles it on and off.
  available_parameters:
