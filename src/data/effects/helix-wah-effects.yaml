- name: Teardrop Bass Q
  based_on: Dunlop 105Q
  firmware_version: '3.80'
  synopsis: The Dunlop 105Q Cry Baby bass wah pedal is a specialized effect that enhances
    bass guitar tone without compromising low-end power. It focuses on midrange and
    high frequencies, allowing expressive wah effects while maintaining a thick sound.
    The pedal features a Q control for adjusting the wah effect's focus, custom circuitry
    optimized for bass, and auto-return switching for ease of use. This design offers
    bassists new creative possibilities while preserving their fundamental tone.
  notable_users: The Dunlop 105Q Cry Baby bass wah is favored by renowned bassists
    such as Flea, Doug Wimbish, and Robert Trujillo.
  available_parameters:
  - Position
  - Q Trim
  - Volume Trim
  - Mix
  - Level
